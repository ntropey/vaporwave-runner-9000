name: Vaporwave Runner 9000 - Universal iOS Builder

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Fleet App to Build'
        required: true
        type: choice
        default: 'logisim-pro'
        options:
          - 'logisim-pro'
          - 'logisim-lite'
          - 'hodoku_revisited'
          - 'nonogram_revisited'
          - 'kakuro_revisited'
          - 'stem-studio'
          - 'midi-companion'
          - 'mockingboard-revisited'
          - 'dolce-colore'
      branch:
        description: 'Git branch'
        required: true
        default: 'main'
      build_number:
        description: 'Override iOS Build Number (optional)'
        required: false
        default: ''
      marketing_version:
        description: 'Override iOS Marketing Version (optional)'
        required: false
        default: ''
  workflow_call:
    inputs:
      target_app:
        description: 'Fleet App to Build'
        required: true
        type: string
      branch:
        description: 'Git branch'
        required: false
        type: string
        default: 'main'
      build_number:
        description: 'Override iOS Build Number'
        required: false
        type: string
        default: ''
      marketing_version:
        description: 'Override iOS Marketing Version'
        required: false
        type: string
        default: ''

jobs:
  build-and-release:
    name: Build & Sign iOS Archive
    runs-on: macos-latest
    steps:
      - name: Select Newest Xcode
        run: |
          XCODE_APP=$(python3 - <<'PY'
          import glob, re
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if p != '/Applications/Xcode.app']
          def key(path):
              m = re.search(r'Xcode[_-](\d+(?:\.\d+)*)', path)
              return tuple(int(part) for part in m.group(1).split('.')) if m else (0,)
          print(max(apps, key=key) if apps else '/Applications/Xcode.app')
          PY
          )
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Resolve Target App Configuration
        id: config
        run: |
          APP="${{ inputs.target_app }}"
          echo "Target App: $APP"

          case "$APP" in
            "logisim-pro")
              REPO="ntropey/logisim_revisited"
              BUNDLE_ID="com.revisitedlabs.logisim"
              WORKSPACE_PATH="packages/app/ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_LOGISIM }}"
              BUILD_TYPE="pnpm-logisim-pro"
              ;;
            "logisim-lite")
              REPO="ntropey/logisim_revisited"
              BUNDLE_ID="com.revisitedlabs.logisim"
              WORKSPACE_PATH="packages/app/ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_LOGISIM }}"
              BUILD_TYPE="pnpm-logisim-lite"
              ;;
            "hodoku_revisited")
              REPO="ntropey/hodoku_revisited"
              BUNDLE_ID="com.revisitedlabs.hodoku"
              WORKSPACE_PATH="packages/app/ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_HODOKU }}"
              BUILD_TYPE="pnpm-hodoku"
              ;;
            "nonogram_revisited")
              REPO="ntropey/nonogram_revisited"
              BUNDLE_ID="com.revisitedlabs.nongram"
              WORKSPACE_PATH="packages/app/ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_NONOGRAM }}"
              BUILD_TYPE="pnpm-nonogram"
              ;;
            "kakuro_revisited")
              REPO="ntropey/kakuro_revisited"
              BUNDLE_ID="com.revisitedlabs.kakuro"
              WORKSPACE_PATH="packages/app/ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_KAKURO }}"
              BUILD_TYPE="pnpm-kakuro"
              ;;
            "stem-studio")
              REPO="ntropey/stem-studio"
              BUNDLE_ID="com.revisitedlabs.stemstudio"
              WORKSPACE_PATH="ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_STEM_STUDIO }}"
              BUILD_TYPE="stem-studio"
              ;;
            "midi-companion")
              REPO="ntropey/midi-companion"
              BUNDLE_ID="com.revisitedlabs.midicompanion"
              WORKSPACE_PATH="ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_MIDI }}"
              BUILD_TYPE="npm"
              ;;
            "mockingboard-revisited")
              REPO="ntropey/mockingbird-revisited"
              BUNDLE_ID="com.revisitedlabs.mockingboard"
              WORKSPACE_PATH="ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_MOCKINGBOARD }}"
              BUILD_TYPE="pnpm-mockingboard"
              ;;
            "dolce-colore")
              REPO="ntropey/dolce-colore"
              BUNDLE_ID="com.revisitedlabs.dolcecolore"
              WORKSPACE_PATH="ios/App/App.xcodeproj"
              PROV_SECRET="${{ secrets.PROV_DOLCE_COLORE }}"
              BUILD_TYPE="dolce-colore"
              ;;
            *)
              echo "Unknown app: $APP"
              exit 1
              ;;
          esac

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_OUTPUT
          echo "workspace_path=$WORKSPACE_PATH" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "$PROV_SECRET" > $RUNNER_TEMP/target_profile.b64

      - name: Clone Target Repository
        run: |
          REPO="${{ steps.config.outputs.repo }}"
          BRANCH="${{ inputs.branch }}"
          echo "Cloning $REPO (branch: $BRANCH)..."
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${{ secrets.GH_PAT }}@github.com/$REPO.git" app_src

      - name: Build Web Assets and Sync Capacitor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd app_src
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_NUMBER="${{ inputs.build_number }}"
          MARKETING_VERSION="${{ inputs.marketing_version }}"
          PBXPROJ="${{ steps.config.outputs.workspace_path }}/project.pbxproj"
          if [ -n "$MARKETING_VERSION" ] && [ -f "$PBXPROJ" ]; then
            sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${MARKETING_VERSION};/g" "$PBXPROJ"
          fi

          case "$BUILD_TYPE" in
            "pnpm-logisim-pro")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" packages/app/ios/App/App.xcodeproj/project.pbxproj
              fi
              pnpm install
              pnpm --filter @logisim/app build
              cd packages/app && npx cap sync ios
              ;;
            "pnpm-logisim-lite")
              BUILD_NUM="${BUILD_NUMBER:-3}"
              sed -i '' 's/Logisim Revisited/Logisim Lab/g' packages/app/capacitor.config.ts
              sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" packages/app/ios/App/App.xcodeproj/project.pbxproj
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Logisim Lab" packages/app/ios/App/App/Info.plist || true

              ICON_SRC="packages/app/store-assets/icons/lite/ios/AppIcon-1024x1024.png"
              ICON_DIR="packages/app/ios/App/App/Assets.xcassets/AppIcon.appiconset"
              if [ -f "$ICON_SRC" ]; then
                sips -z 20 20 "$ICON_SRC" --out "$ICON_DIR/AppIcon-20x20@1x.png" >/dev/null || true
                sips -z 40 40 "$ICON_SRC" --out "$ICON_DIR/AppIcon-20x20@2x.png" >/dev/null || true
                sips -z 60 60 "$ICON_SRC" --out "$ICON_DIR/AppIcon-20x20@3x.png" >/dev/null || true
                sips -z 29 29 "$ICON_SRC" --out "$ICON_DIR/AppIcon-29x29@1x.png" >/dev/null || true
                sips -z 58 58 "$ICON_SRC" --out "$ICON_DIR/AppIcon-29x29@2x.png" >/dev/null || true
                sips -z 87 87 "$ICON_SRC" --out "$ICON_DIR/AppIcon-29x29@3x.png" >/dev/null || true
                sips -z 40 40 "$ICON_SRC" --out "$ICON_DIR/AppIcon-40x40@1x.png" >/dev/null || true
                sips -z 80 80 "$ICON_SRC" --out "$ICON_DIR/AppIcon-40x40@2x.png" >/dev/null || true
                sips -z 120 120 "$ICON_SRC" --out "$ICON_DIR/AppIcon-40x40@3x.png" >/dev/null || true
                sips -z 120 120 "$ICON_SRC" --out "$ICON_DIR/AppIcon-60x60@2x.png" >/dev/null || true
                sips -z 180 180 "$ICON_SRC" --out "$ICON_DIR/AppIcon-60x60@3x.png" >/dev/null || true
                sips -z 76 76 "$ICON_SRC" --out "$ICON_DIR/AppIcon-76x76@1x.png" >/dev/null || true
                sips -z 152 152 "$ICON_SRC" --out "$ICON_DIR/AppIcon-76x76@2x.png" >/dev/null || true
                sips -z 167 167 "$ICON_SRC" --out "$ICON_DIR/AppIcon-83.5x83.5@2x.png" >/dev/null || true
                cp "$ICON_SRC" "$ICON_DIR/AppIcon-512@2x.png" || true
                cp "$ICON_SRC" "$ICON_DIR/AppIcon-1024x1024.png" || true
              fi

              pnpm install
              VITE_EDITION=lite pnpm --filter @logisim/app build
              cd packages/app && npx cap sync ios
              ;;
            "pnpm-hodoku")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" packages/app/ios/App/App.xcodeproj/project.pbxproj
              fi
              pnpm install
              pnpm --filter @hodoku/app build
              cd packages/app && npx cap sync ios
              ;;
            "pnpm-nonogram")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" packages/app/ios/App/App.xcodeproj/project.pbxproj
              fi
              pnpm install
              pnpm --filter @nonogram/app build
              cd packages/app && npx cap sync ios
              ;;
            "pnpm-kakuro")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" packages/app/ios/App/App.xcodeproj/project.pbxproj
              fi
              pnpm install
              pnpm --filter @kakuro/app build
              cd packages/app && npx cap sync ios
              ;;
            "pnpm-mockingboard")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
              fi
              pnpm install
              pnpm run build
              npx cap sync ios
              ;;
            "stem-studio")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
              fi
              mkdir -p weights
              echo "Downloading HTDemucs FP16 ONNX weights from release v1.1.0..."
              gh release download v1.1.0 -p "htdemucs_fp16weights_pruned.onnx" -D weights -R ntropey/stem-studio
              ls -lh weights/htdemucs_fp16weights_pruned.onnx
              cd frontend
              npm ci || npm install
              npm run build
              npx cap sync ios
              ;;
            "dolce-colore")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
              fi
              mkdir -p weights
              echo "Downloading DDColor tiny FP16 ONNX model..."
              curl -fSL "https://huggingface.co/edgetools/ddcolor/resolve/main/ddcolor-tiny-fp16.onnx" -o weights/ddcolor-tiny-mobile.onnx
              ls -lh weights/ddcolor-tiny-mobile.onnx
              cd frontend
              npm ci || npm install
              npm run build
              npx cap sync ios
              ;;
            "npm")
              if [ -n "$BUILD_NUMBER" ]; then
                sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
              fi
              npm ci || npm install
              npm run build
              npx cap sync ios
              ;;
          esac

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          base64 --decode -i $RUNNER_TEMP/target_profile.b64 -o $PP_PATH

          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Installed provisioning profile with UUID: $UUID"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "profile_name=$PROFILE_NAME" >> $GITHUB_ENV
          echo "profile_uuid=$UUID" >> $GITHUB_ENV

      - name: Build Archive & Export IPA
        env:
          DEVELOPMENT_TEAM: "5BJAQ969Y4"
          CODE_SIGN_IDENTITY: "Apple Distribution"
        run: |
          BUNDLE_ID="${{ steps.config.outputs.bundle_id }}"
          WORKSPACE_REL="${{ steps.config.outputs.workspace_path }}"

          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CODE_SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$profile_name</string>
            </dict>
          </dict>
          </plist>
          EOF

          cd app_src
          WORKSPACE_DIR=$(dirname "$WORKSPACE_REL")
          cd "$WORKSPACE_DIR"

          if [ -d "App.xcworkspace" ]; then
            BUILD_FLAG="-workspace App.xcworkspace"
          elif [ -d "App.xcodeproj" ]; then
            BUILD_FLAG="-project App.xcodeproj"
          else
            PROJECT_FILE=$(basename "$WORKSPACE_REL")
            if [[ "$PROJECT_FILE" == *.xcworkspace ]]; then
              BUILD_FLAG="-workspace $PROJECT_FILE"
            else
              BUILD_FLAG="-project $PROJECT_FILE"
            fi
          fi
          echo "Building with: $BUILD_FLAG in $(pwd)"

          xcodebuild $BUILD_FLAG \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name"

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/build/App.ipa" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Successfully uploaded IPA directly to App Store Connect!"
