name: Vaporwave Runner 9000 - Nightly Batch iOS Builder

on:
  schedule:
    # 03:00 UTC = 10:00 PM EST (off-peak, queue-free window)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Trigger full matrix batch immediately'
        type: boolean
        default: true

jobs:
  batch-builder:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - app: 'logisim-lite'
            build_num: '3'
          - app: 'logisim-pro'
            build_num: '7'
    uses: ./.github/workflows/build-ios.yml
    with:
      target_app: ${{ matrix.app }}
      branch: 'main'
      build_number: ${{ matrix.build_num }}
    secrets: inherit
