name: Vaporwave Runner 9000 - Android AAB Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch of ntropey/logisim_revisited'
        required: true
        default: 'main'
      version_code:
        description: 'Override Android versionCode (optional; must be higher than the last Play upload)'
        required: false
        default: ''
      version_name:
        description: 'Override Android versionName (optional)'
        required: false
        default: ''

jobs:
  build-aab:
    name: Build & Sign Android AAB (LogicSim, com.revisitedlabs.logisim)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clone app repository
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${{ secrets.GH_PAT }}@github.com/ntropey/logisim_revisited.git" app_src

      - name: Apply version overrides
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cd app_src/packages/app/android/app
          if [ -n "$VERSION_CODE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" build.gradle
          fi
          if [ -n "$VERSION_NAME" ]; then
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          fi
          grep -n "versionCode\|versionName" build.gradle

      - name: Build web assets and sync Capacitor Android
        run: |
          cd app_src
          pnpm install
          pnpm --filter @logisim/app build
          cd packages/app
          npx cap sync android

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_PASSWORD secrets."
            exit 1
          fi
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: android
        run: |
          cd app_src/packages/app/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify signature
        run: |
          AAB=app_src/packages/app/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | head -1
          keytool -printcert -jarfile "$AAB" | grep SHA256

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: logisim-android-aab
          path: app_src/packages/app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
