name: Vaporwave Runner 9000 - Upload iOS Screenshots

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target GitHub repo (owner/name)'
        required: true
        default: 'ntropey/dolce-colore'
      branch:
        description: 'Git branch containing store_assets/ios/'
        required: true
        default: 'feat/ios-appstore-screenshots'
      bundle_id:
        description: 'App Store Connect Bundle ID'
        required: true
        default: 'com.revisitedlabs.dolcecolore'
      version_name:
        description: 'Optional new version string (blank auto-uses editable version or bumps patch)'
        required: false
        default: ''
      remove_in_review:
        description: 'Remove version from review if currently waiting/in review'
        type: boolean
        default: true
      submit:
        description: 'Submit version for App Store review after uploading screenshots'
        type: boolean
        default: true

jobs:
  upload-screenshots:
    name: Upload App Store Screenshots & Submit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone target repository
        run: |
          git clone --depth 1 --branch "${{ inputs.branch }}" "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ inputs.repo }}.git" app_src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pyjwt cryptography requests

      - name: Prepare App Store Connect key
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
        run: |
          echo -n "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload screenshots and submit
        env:
          ASC_KEY_ID: ${{ secrets.KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_NAME: ${{ inputs.version_name }}
          REMOVE_IN_REVIEW: ${{ inputs.remove_in_review }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          cd app_src
          args=(--bundle-id "$BUNDLE_ID")
          if [ -n "$VERSION_NAME" ]; then
            args+=(--version-name "$VERSION_NAME")
          fi
          if [ "$REMOVE_IN_REVIEW" = "true" ]; then
            args+=(--remove-in-review)
          fi
          if [ "$SUBMIT" = "true" ]; then
            args+=(--submit)
          fi
          python tools/asc_upload_screenshots.py "${args[@]}"
